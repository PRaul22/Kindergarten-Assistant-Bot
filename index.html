<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistent Grădinițe Sibiu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat {
            height: 675px;
            overflow-y: auto;
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user-message {
            align-self: flex-end;
            background-color: #3498db;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #ecf0f1;
            color: #2c3e50;
            border-bottom-left-radius: 2px;
        }

        #input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
            background: #fff;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #3498db;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Asistent Grădinițe Sibiu</h1>
    
    <div id="chat-container">
        <div id="chat">
            <div class="message ai-message">Bună! Cu ce te pot ajuta astăzi în legătură cu grădinițele din Sibiu?</div>
        </div>
        
        <div id="input-area">
            <input type="text" id="mesajUtilizator" placeholder="Scrie un mesaj..." onkeypress="handleKeyPress(event)">
            <button onclick="trimiteMesajAJAX()">Trimite</button>
        </div>
    </div>

    <script>
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                trimiteMesajAJAX();
            }
        }

        function trimiteMesajAJAX() {
            const input = document.getElementById("mesajUtilizator");
            const mesaj = input.value;
            const chat = document.getElementById("chat");

            if (!mesaj.trim()) return;

            chat.innerHTML += `<div class="message user-message">${mesaj}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;
            

            fetch("http://localhost:8000/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ mesaj: mesaj })
            })
            .then(response => response.json())
            .then(data => {
                let raspunsFormatat = data.raspuns.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                raspunsFormatat = raspunsFormatat.replace(/\n/g, '<br>');
                
                chat.innerHTML += `<div class="message ai-message"><strong>Asistent:</strong><br>${raspunsFormatat}</div>`;
                chat.scrollTop = chat.scrollHeight;
            })
            .catch(eroare => {
                chat.innerHTML += `<div class="message ai-message" style="color: red;">Eroare de conexiune la server.</div>`;
            });
        }
    </script>
</body>
</html>
